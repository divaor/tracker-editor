name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test

  # The Android app runs the main process on its own Node.js 18 (nodejs-mobile), and the tests
  # above run on 22: the main process's tests run on 18 too, so an API 18 lacks (zlib.crc32 was
  # one) fails here, not on a phone.
  phone-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - uses: actions/setup-node@v5
        with:
          node-version: 18
      - run: node --version && npm run test:phone-node

  # The debugger with the real adapters (test/dap-real.test.js): debugpy (and pytest) from PyPI
  # and the pinned js-debug (electron/dap.cjs JS_DEBUG_VERSION) from its GitHub release, the way
  # the editor's Set up dialog has the person install them. Breakpoints in a .py and a .js file,
  # the stack, variables, a step, the console, to the end; a pytest and a node:test test.
  debuggers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install debugpy pytest
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: js-debug (the pinned release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./electron/dap.cjs').JS_DEBUG_VERSION")
          mkdir -p "$RUNNER_TEMP/debuggers"
          if ! curl -fsSL "https://github.com/microsoft/vscode-js-debug/releases/download/v$VERSION/js-debug-dap-v$VERSION.tar.gz" | tar -xz -C "$RUNNER_TEMP/debuggers"; then
            echo "::error::js-debug-dap v$VERSION was not found. Recent releases: $(gh api repos/microsoft/vscode-js-debug/releases --jq '[.[0:8][] | .tag_name + " [" + ([.assets[].name | select(startswith("js-debug-dap"))] | join(",")) + "]"] | join("; ")')"
            exit 1
          fi
          ls -l "$RUNNER_TEMP/debuggers/js-debug/src/dapDebugServer.js"
      - name: The real adapters
        env:
          DAP_REAL_REQUIRED: '1'
          JS_DEBUG_DIR: ${{ runner.temp }}/debuggers
        run: DEBUGPY_PYTHON="$(command -v python)" node --test test/dap-real.test.js
