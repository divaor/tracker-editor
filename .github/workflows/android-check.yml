# Runs the Android app in an emulator and checks, in its real WebView, what a desktop browser
# cannot stand in for: text from images (tesseract's worker and models as the APK holds them),
# the phone's text to speech, Kokoro served from this machine as from a computer on the phone's
# network, PDFs (pdf.js and its worker), documents converted on the page, a shell on the phone,
# and folder comparisons laid out for a phone and turned sideways (scripts/android-check.mjs).
# Run it by hand from Actions → Android check. Its APK is a debug build with WebView debugging
# on, for this check only: the release's setting stays off.
name: Android check

on:
  workflow_dispatch:

jobs:
  webview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # An older WebView (Android 14's own) and a recent one.
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 36]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm install --no-save playwright-core@1.56.1
      - name: WebView debugging on (this build only)
        run: |
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('capacitor.config.json'));c.android.webContentsDebuggingEnabled=true;fs.writeFileSync('capacitor.config.json',JSON.stringify(c,null,2))"
      - run: npx cap sync android
      - uses: actions/cache@v5
        with:
          path: android/app/libnode
          key: libnode-${{ hashFiles('scripts/android-node.js') }}
      - run: npm run android:node
      - run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: android
      # Kokoro on this machine, as on a computer next to the phone: the emulator reaches it at 10.0.2.2.
      - name: Kokoro speech server
        run: |
          docker run -d --name kokoro -p 8880:8880 ghcr.io/remsky/kokoro-fastapi-cpu:v0.9.1
          for i in $(seq 1 60); do curl -sf http://localhost:8880/health && exit 0; sleep 5; done
          docker logs kokoro | tail -40
          exit 1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # An x86_64 image translates the app's arm64 libraries (Android 11 and later).
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: KOKORO=http://10.0.2.2:8880/v1 node scripts/android-check.mjs $(ls android/app/build/outputs/apk/debug/*.apk)
      # Each failed check as an annotation, so the run's page (and the API) says which one.
      - name: Failed checks
        if: failure()
        run: |
          [ -f android-check/report.json ] || exit 0
          node -e "for (const r of require('./android-check/report.json')) if (!r.ok) console.log('::error title=' + r.name.replace(/[,:\n]/g, ' ') + '::' + String(typeof r.detail === 'string' ? r.detail : JSON.stringify(r.detail)).replace(/%/g, '%25').replace(/\r/g, '').replace(/\n/g, '%0A').slice(0, 3000))"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-check-api${{ matrix.api-level }}
          if-no-files-found: ignore
          path: android-check/
