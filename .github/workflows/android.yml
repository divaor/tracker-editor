# Builds the Android app (a debug APK, signed with a throwaway key) whenever its native side
# changes, so a broken build shows before a release. Releases build the signed APK in
# release.yml. Run it by hand from Actions → Android build to get an APK to try.
name: Android build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - 'package-lock.json'
      - 'mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: android
      - uses: actions/upload-artifact@v7
        with:
          name: tracker-editor-android-debug
          if-no-files-found: error
          path: android/app/build/outputs/apk/debug/*.apk
