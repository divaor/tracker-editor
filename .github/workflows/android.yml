# Builds the Android app (a debug APK, signed with a throwaway key) whenever its native side
# changes, so a broken build shows before a release. Releases build the signed APK in
# release.yml. Run it by hand from Actions → Android build to get an APK to try.
name: Android build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - 'package-lock.json'
      - 'mobile/**'
      - 'scripts/android-node.js'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npx cap sync android
      # The app's own Node.js (nodejs-mobile, about 100 MB to fetch): kept between runs.
      - uses: actions/cache@v5
        with:
          path: android/app/libnode
          key: libnode-${{ hashFiles('scripts/android-node.js') }}
      - run: npm run android:node
      - run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: android
      - name: Check what the APK holds
        run: |
          apk=$(ls android/app/build/outputs/apk/debug/*.apk)
          for f in lib/arm64-v8a/libnode.so lib/arm64-v8a/libnodehost.so lib/arm64-v8a/libtrackerpty.so lib/arm64-v8a/libc++_shared.so assets/nodejs/mobile/node/main.cjs assets/nodejs/electron/main.cjs assets/nodejs/node_modules/ssh2/package.json assets/public/index.html; do
            unzip -l "$apk" "$f" > /dev/null || { echo "::error::$f is missing from the APK"; exit 1; }
          done
          ls -l "$apk"
      - uses: actions/upload-artifact@v7
        with:
          name: tracker-editor-android-debug
          if-no-files-found: error
          path: android/app/build/outputs/apk/debug/*.apk
